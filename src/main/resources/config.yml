# VTDXStats - stat distribution system using VTuberDexBridge + MythicLib

# Level source
level:
  # VTuberDexBridge profile.gameLevel() is used by default.
  # Fallback when bridge/profile unavailable:
  # NONE - treat as level 1 (no extra points)
  # FIXED - use fallback-fixed-level
  # LAST_KNOWN - use last known bridge level, else fallback-fixed-level
  fallback-source: LAST_KNOWN
  fallback-fixed-level: 1
  max-level: 100
  points-per-level: 5

  # Max points that can be allocated into a single stat until a level threshold.
  # Add as many lines as needed. The highest level <= player level applies.
  # If omitted/empty, no level cap is applied (only stat max-points).
  # Example requested: up to 25 at lvl25, 50 at lvl40, 100 at lvl60, 200 at lvl100.
  stat-point-caps:
    - level: 25
      max-points: 25
    - level: 40
      max-points: 50
    - level: 60
      max-points: 100
    - level: 100
      max-points: 200

# MythicLib command templates. Placeholders: {player} {stat} {value} {key}
mythiclib:
  enabled: true
  key: vtdxstats
  command-add: "ml stat add {player} {stat} {value} 0 {key}"
  command-remove: "ml stat remove {player} {stat} {key}"
  # Apply stats on join after delay (ticks)
  apply-delay-ticks: 40

# If config reduces a stat max below points already allocated, clamp and refund.
clamp-refund-on-reload: true

# GUI settings. Slots are 0-53. Invalid/duplicate slots are auto-resolved.
gui:
  format:
    # Used in overview attribute items. Placeholders: {stat}, {attr}, {sep}
    attribute-separator: " <gray>? <white>"
    attribute-name: "<aqua>{stat}{sep}{attr}</white>"
  overview:
    title: "<dark_purple>Tus stats</dark_purple>"
    size: 54
    filler: GRAY_STAINED_GLASS_PANE
    slots:
      info: 4
      repartir: 49
      cerrar: 53
      # 12 stat value slots in order of stats.*.attributes
      values: [9,10,12,13,15,16,27,28,30,31,33,34]
      # 6 bonus slots in order of stats.*.bonuses
      bonuses: [20,21,23,24,38,39]
  repartir:
    title: "<dark_purple>Repartir puntos</dark_purple>"
    size: 54
    filler: GRAY_STAINED_GLASS_PANE
    # Progress bar shown in stat items. bar-length is the total chars.
    bar-length: 10
    bar-filled: "?"
    bar-empty: "?"
    slots:
      info: 4
      volver: 45
      cerrar: 53
      stats: [19,21,23,25,29,31]
  admin:
    players-title: "<dark_red>VTDXStats Admin</dark_red>"
    player-title: "<dark_red>Stats: {player}</dark_red>"
    size: 54
    filler: GRAY_STAINED_GLASS_PANE
    players-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
    slots:
      prev: 45
      next: 53
      back: 45
      reset: 49
      close: 53
      config: 46
      info: 4
      # Scale toggle slots (attributes/bonuses in order)
      stats: [19,20,21,22,23,24,28,29,30,31,32,33,37,38,39,40,41,42]

messages:
  no-permission: "<red>No tienes permiso.</red>"
  no-bridge: "<red>VTuberDexBridge no est? disponible.</red>"
  no-profile: "<red>No se pudo obtener tu perfil de VTuberDex.</red>"
  no-points: "<red>No tienes puntos disponibles.</red>"
  maxed: "<yellow>Esta stat ya est? al m?ximo.</yellow>"
  level-cap: "<yellow>Alcanzaste el l?mite de esta stat para tu nivel actual.</yellow>"
  stat-disabled: "<red>Esa stat est? desactivada por un administrador.</red>"
  assigned: "<green>Asignaste <white>{amount}</white> punto(s) a <white>{stat}</white>.</green>"
  reset-self: "<green>Tus puntos de stats fueron reiniciados.</green>"
  reset-other: "<green>Stats reiniciadas para <white>{player}</white>.</green>"
  reloaded: "<green>VTDXStats recargado.</green>"

